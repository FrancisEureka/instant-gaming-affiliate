name: Eureka Gaming Deals & Free Games

on:
  schedule:
    # Executa 3 vezes ao dia: às 08:00, 12:00 e 18:00 (Horário de Brasília)
    # 11:00 UTC = 08:00 BRT | 15:00 UTC = 12:00 BRT | 21:00 UTC = 18:00 BRT
    - cron: '0 11,15,21 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  post-deals:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite salvar o histórico de ofertas postadas

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar bot de ofertas e jogos grátis
        env:
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_INSTANCE: ${{ secrets.WHATSAPP_INSTANCE }}
          WHATSAPP_DEALS_GROUP: ${{ secrets.WHATSAPP_DEALS_GROUP }}
          WHATSAPP_FREE_GAMES_GROUP: ${{ secrets.WHATSAPP_FREE_GAMES_GROUP }}
        run: |
          python scripts/instant_gaming_deals.py
          python scripts/free_games_deals.py

      - name: Salvar histórico de postagens
        run: |
          git config --global user.name "Eureka Deals Bot"
          git config --global user.email "bot@franciseureka.com"
          git add scripts/posted_deals_history.json scripts/posted_free_games_history.json
          git commit -m "chore: atualizar histórico de ofertas e jogos grátis [skip ci]" || exit 0
          git push
