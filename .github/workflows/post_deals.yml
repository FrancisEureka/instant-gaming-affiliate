name: Post Instant Gaming Deals

on:
  schedule:
    # Executa todos os dias às 15:00 UTC (12:00 Horário de Brasília)
    - cron: '0 15 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

jobs:
  post-deals:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite salvar o histórico de ofertas postadas

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar bot de ofertas
        run: |
          python scripts/instant_gaming_deals.py

      - name: Salvar histórico de postagens
        run: |
          git config --global user.name "Eureka Deals Bot"
          git config --global user.email "bot@franciseureka.com"
          git add scripts/posted_deals_history.json
          git commit -m "chore: atualizar histórico de ofertas [skip ci]" || exit 0
          git push
